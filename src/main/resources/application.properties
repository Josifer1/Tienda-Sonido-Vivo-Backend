spring.application.name=api-sonido-vivo

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sonido_vivo
spring.datasource.username=postgres
spring.datasource.password=${BD_CLAVE}

# Crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Evita mantener consultas abiertas mientras se arma la respuesta
spring.jpa.open-in-view=false